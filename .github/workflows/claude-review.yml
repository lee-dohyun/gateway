# Claude 자동 PR 리뷰
#
# 전제: 저장소(또는 조직) 시크릿에 ANTHROPIC_API_KEY 가 등록되어 있어야 한다.
# 시크릿이 없으면 이 워크플로는 조용히 건너뛴다(아래 if 조건) — PR 자체를 막지는 않는다.
#
# 왜 ubuntu-latest 인가: 이 클러스터의 self-hosted runner(k3s-home)는 배포 전용이며
# 배포용 kubeconfig 에 접근할 수 있다. API 키를 그 러너에 올리면 노출면이 넓어지므로
# 리뷰 잡은 GitHub 호스티드 러너에서 돌린다.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for API key
        id: guard
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY 시크릿이 없어 Claude 리뷰를 건너뜁니다."
          fi
      - name: Claude review
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            PR 변경분을 리뷰하라. 이 저장소는 모든 도메인의 단일 진입점이며 인증을 전담한다.
            
            우선 확인할 것 (실제 인시던트 이력 기반):
            1. application*.yml 라우트 변경 시 JwtAuthenticationFilter 의 PROTECTED_HOSTS / PUBLIC_EXACT_PATHS
               와 정합한가. 라우팅과 인증 강제는 서로 독립된 메커니즘이라, 로그인 전 접근이 필요한 경로가
               화이트리스트에 없으면 조용히 302 로 튕긴다(2026-08-02 /verify 인시던트).
            2. X-User-* 헤더를 게이트웨이가 항상 덮어쓰는가. 클라이언트가 보낸 값을 통과시키면 인증 우회다
               (2026-08-12 스푸핑 인시던트).
            3. prod 설정과 local 설정 양쪽에 라우트가 반영됐는가.
            
            main push 가 곧 프로덕션 배포이므로 배포 후 되돌리기 어려운 변경을 특히 주의해서 볼 것.
            확실한 결함만 지적하고, 추측성 지적은 하지 말 것.
          claude_args: --model claude-sonnet-5 --max-turns 15
