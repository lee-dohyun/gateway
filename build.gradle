plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.dh'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

compileJava.options.encoding = 'UTF-8'

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.3")
	// 이미지 스캔 경고 중 Boot 3.5.16 이 관리하는 버전보다 뒤에 수정본이 나온 것들(gateway#247).
	// Boot 를 올려 관리 버전이 이 값을 넘어서면 해당 줄을 지운다 - 남겨 두면 오히려 낮은 버전에 묶인다.
	set('jackson-bom.version', '2.21.7')
	set('netty.version', '4.1.137.Final')
	set('log4j2.version', '2.25.5')
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'       // ✅ WebFlux 기반 Gateway
	implementation 'org.springframework.boot:spring-boot-starter-webflux'         // ✅ Netty 기반 웹서버
	implementation 'org.springframework.boot:spring-boot-starter-actuator'        // ✅ /actuator/health (liveness/readiness probe)
	implementation 'io.micrometer:micrometer-registry-prometheus'                 // ✅ /actuator/prometheus
	implementation 'com.nimbusds:nimbus-jose-jwt:9.37.4'
	constraints {
		// spring-cloud-starter 가 끌고 오는 bcprov 1.80.2 의 수정본(gateway#247). Spring Cloud 를 올려 이 값을 넘어서면 지운다.
		implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
	}
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

jacocoTestReport {
	dependsOn test
}