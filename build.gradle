plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.dh'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

compileJava.options.encoding = 'UTF-8'

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.3")
	// 이미지 스캔 경고 중 Boot 4.0.8 이 관리하는 버전보다 뒤에 수정본이 나온 것들(gateway#348).
	// Boot 를 올려 관리 버전이 이 값을 넘어서면 해당 줄을 지운다 - 남겨 두면 오히려 낮은 버전에 묶인다.
	set('jackson-bom.version', '3.1.7')
	set('jackson-2-bom.version', '2.21.7')
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'       // ✅ WebFlux 기반 Gateway
	implementation 'org.springframework.boot:spring-boot-starter-webflux'         // ✅ Netty 기반 웹서버
	implementation 'org.springframework.boot:spring-boot-starter-actuator'        // ✅ /actuator/health (liveness/readiness probe)
	// Boot 4 는 자동 설정을 모듈로 쪼갰다 - WebClient.Builder 빈(JWKS 조회 등)은 이 스타터가 있어야 생긴다(gateway#348).
	implementation 'org.springframework.boot:spring-boot-starter-webclient'
	implementation 'io.micrometer:micrometer-registry-prometheus'                 // ✅ /actuator/prometheus
	implementation 'com.nimbusds:nimbus-jose-jwt:9.37.4'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'io.projectreactor:reactor-test'
	// 로그인 경로 레이트리밋이 실제 Redis(Lua 스크립트)에서 의도한 숫자로 동작하는지 보는 테스트용(gateway#327).
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

jacocoTestReport {
	dependsOn test
}