gateway:
   security:
      keycloak-issuer: https://keycloak.localhost/realms/customer
      keycloak-realm-url: http://keycloak:8080/realms/customer
      protected-hosts: customer.localhost
      optional-auth-hosts: product.localhost
      home-hosts: home.localhost
      login-url: http://customer.localhost:8080/login
spring:
   cloud:
      gateway:
         routes:
         -  id: customer-auth-api
            predicates:
            - Host=customer.localhost
            - Path=/api/auth/**
            uri: http://auth-api:8080
         -  id: customer-front
            predicates:
            - Host=customer.localhost
            uri: http://customer-front:3000
         -  id: store-front
            predicates:
            - Host=home.localhost
            uri: http://store-front:3000
         -  id: auth-api-direct
            predicates:
            - Host=auth.localhost
            uri: http://auth-api:8080

logging:
   level:
      '[com.dh.gateway.security]': DEBUG
