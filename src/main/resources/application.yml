server:
   forward-headers-strategy: framework
management:
   endpoints:
      web:
         exposure:
            include: health,prometheus
   metrics:
      tags:
         application: ${spring.application.name}
gateway:
   security:
      keycloak-issuer: ${SHOP_KEYCLOAK_ISSUER:https://keycloak.posselect.com/realms/customer}
      keycloak-realm-url: ${SHOP_KEYCLOAK_REALM_URL:http://keycloak-service.keycloak.svc.cluster.local/realms/customer}
      protected-hosts: ${SHOP_PROTECTED_HOSTS:customer.posselect.com}
      optional-auth-hosts: ${SHOP_OPTIONAL_AUTH_HOSTS:product.posselect.com}
      home-hosts: ${SHOP_HOME_HOSTS:home.posselect.com,www.posselect.com}
      login-url: ${SHOP_LOGIN_URL:https://customer.posselect.com/login}
spring:
   application:
      name: gateway
   cloud:
      gateway:
         routes:
         -  id: tool
            predicates:
            - Host=tool.leedohyun.com
            uri: http://tool-service.tool.svc.cluster.local:80
         -  id: root-redirect
            predicates:
            - Host=leedohyun.com,www.leedohyun.com
            filters:
            - RedirectTo=302, https://architecture.leedohyun.com
            uri: no://op
         -  id: shop-root-redirect
            predicates:
            - Host=posselect.com
            filters:
            - RedirectTo=302, https://home.posselect.com
            uri: no://op
         -  id: shop-customer-redirect
            predicates:
            - Host=customer.leedohyun.com
            filters:
            - RedirectTo=302, https://customer.posselect.com
            uri: no://op
         -  id: shop-home-redirect
            predicates:
            - Host=home.leedohyun.com
            filters:
            - RedirectTo=302, https://home.posselect.com
            uri: no://op
         -  id: shop-product-redirect
            predicates:
            - Host=product.leedohyun.com
            filters:
            - RedirectTo=302, https://product.posselect.com
            uri: no://op
         -  id: shop-admin-redirect
            predicates:
            - Host=admin.leedohyun.com
            filters:
            - RedirectTo=302, https://admin.posselect.com
            uri: no://op
         -  id: shop-keycloak-redirect
            predicates:
            - Host=keycloak.leedohyun.com
            filters:
            - RedirectTo=302, https://keycloak.posselect.com
            uri: no://op
         -  id: wordpress
            predicates:
            - Host=blog.leedohyun.com,wordpress.leedohyun.com
            uri: http://wordpress-service:80
         -  id: minio-api
            predicates:
            - Host=static.leedohyun.com
            uri: http://minio.minio.svc.cluster.local:9000
         -  id: minio-console
            predicates:
            - Host=minio.leedohyun.com,minio.posselect.com
            filters:
            - SetRequestHeader=Host, minio.leedohyun.com
            - RemoveRequestHeader=Origin
            uri: http://minio-console.minio.svc.cluster.local:9001
         -  id: shop-static-assets
            predicates:
            - Host=static.posselect.com
            uri: http://minio.minio.svc.cluster.local:9000
         -  id: cdn-alias
            predicates:
            - Host=image.posselect.com
            - Path=/cdn/**
            uri: http://cdn-alias-service.minio.svc.cluster.local:80
         -  id: shop-image-proxy
            predicates:
            - Host=image.posselect.com
            uri: http://imgproxy-service.minio.svc.cluster.local:8080
         -  id: redmine
            predicates:
            - Host=alm.leedohyun.com,redmine.leedohyun.com
            uri: http://redmine-service.redmine.svc.cluster.local:3000
         -  id: keycloak
            predicates:
            - Host=keycloak.posselect.com
            uri: http://keycloak-service.keycloak.svc.cluster.local:80
         -  id: architecture
            predicates:
            - Host=architecture.leedohyun.com,architecture.posselect.com
            uri: http://architecture-web-service.default.svc.cluster.local:80
         -  id: auth-api
            predicates:
            - Host=customer.posselect.com
            - Path=/api/auth/**
            uri: http://auth-api.customer.svc.cluster.local:8080
         -  id: order-api-customer
            predicates:
            - Host=customer.posselect.com
            - Path=/api/orders/**
            uri: http://order-api.customer.svc.cluster.local:8080
         # 2026-08-14 보안 사고 대응(Redmine msa #155): customer-front도 store-front와
         # 마찬가지로 자체 POST 라우트 핸들러/Server Action이 전혀 없어(전부 auth-api/
         # order-api-customer가 처리) 같은 완화책 적용. /api/auth/**, /api/orders/**는
         # 위 라우트가 먼저 채가므로 영향 없음.
         -  id: customer-front-block-write
            predicates:
            - Host=customer.posselect.com
            - Method=POST,PUT,PATCH,DELETE
            filters:
            - SetStatus=403
            uri: no://op
         -  id: customer-front
            predicates:
            - Host=customer.posselect.com
            uri: http://customer-front.customer.svc.cluster.local:3000
         -  id: auth-api-home
            predicates:
            - Host=home.posselect.com,www.posselect.com
            - Path=/api/auth/**
            uri: http://auth-api.customer.svc.cluster.local:8080
         # 2026-08-14 보안 사고 대응(Redmine msa #155): home.posselect.com은 정적
         # 랜딩이라 /api/auth/** 외엔 쓰기성 요청이 정상 트래픽에 없다. 외부 POST /
         # 요청이 컨테이너 내 셸 실행(curl)으로 이어지는 정황이 확인되어, 근본 원인
         # (Next.js) 패치 전까지 임시 완화책으로 이 호스트의 POST/PUT/PATCH/DELETE를
         # 전부 차단한다. auth-api-home 라우트가 위에서 /api/auth/**를 먼저 채가므로
         # 로그인/회원가입 등 정상 기능에는 영향 없음. www.posselect.com도 2026-08-14부터
         # home.posselect.com과 동일하게 직접 서비스되므로 같은 보호를 적용한다.
         -  id: store-front-block-write
            predicates:
            - Host=home.posselect.com,www.posselect.com
            - Method=POST,PUT,PATCH,DELETE
            filters:
            - SetStatus=403
            uri: no://op
         -  id: store-front
            predicates:
            - Host=home.posselect.com,www.posselect.com
            uri: http://store-front.customer.svc.cluster.local:3000
         -  id: product-api
            predicates:
            - Host=product.posselect.com
            - Path=/api/products/**,/api/categories/**,/api/cart/**
            uri: http://product-api.customer.svc.cluster.local:8080
         -  id: order-api
            predicates:
            - Host=product.posselect.com
            - Path=/api/orders/**
            uri: http://order-api.customer.svc.cluster.local:8080
         -  id: auth-api-addresses-product
            predicates:
            - Host=product.posselect.com
            - Path=/api/auth/addresses/**
            uri: http://auth-api.customer.svc.cluster.local:8080
         # 2026-08-14 보안 사고 대응(Redmine msa #155): product-front도 자체 POST
         # 핸들러/Server Action이 없어(전부 product-api/order-api/auth-api-addresses-
         # product가 처리) 같은 완화책 적용.
         -  id: product-front-block-write
            predicates:
            - Host=product.posselect.com
            - Method=POST,PUT,PATCH,DELETE
            filters:
            - SetStatus=403
            uri: no://op
         -  id: product-front
            predicates:
            - Host=product.posselect.com
            uri: http://product-front.customer.svc.cluster.local:3000
         # 2026-08-14 보안 사고 대응(Redmine msa #155): admin-front는 다른 프론트와
         # 달리 /api/admin/**, /api/login 등을 게이트웨이 라우트 분리 없이 자기 자신이
         # 직접 처리한다. 그래서 store-front 방식대로 통째로 막으면 관리자 로그인/상품
         # 관리 기능이 깨진다. /api/** 는 이 carve-out으로 먼저 통과시키고, 그 외
         # 경로(페이지 라우트)로 오는 쓰기성 요청만 차단한다.
         -  id: admin-front-api
            predicates:
            - Host=admin.posselect.com
            - Path=/api/**
            uri: http://admin-front.customer.svc.cluster.local:3000
         -  id: admin-front-block-write
            predicates:
            - Host=admin.posselect.com
            - Method=POST,PUT,PATCH,DELETE
            filters:
            - SetStatus=403
            uri: no://op
         -  id: admin-front
            predicates:
            - Host=admin.posselect.com
            uri: http://admin-front.customer.svc.cluster.local:3000
         -  id: monitoring-redirect
            predicates:
            - Host=monitoring.leedohyun.com
            filters:
            - RedirectTo=302, https://monitoring.posselect.com
            uri: no://op
         -  id: monitoring
            predicates:
            - Host=monitoring.posselect.com
            uri: http://monitoring-grafana.monitoring.svc.cluster.local:80
            filters:
            - PreserveHostHeader
         # ui.posselect.com과 storybook.posselect.com은 같은 서비스(디자인 시스템 문서
         # 사이트 = Storybook 정적 빌드)를 가리키는 두 진입점이다. ui.* 가 원래 이름이라
         # 기존 링크/북마크 호환을 위해 유지하고, storybook.* 을 별칭으로 추가했다.
         -  id: posselect-ui
            predicates:
            - Host=ui.posselect.com,storybook.posselect.com
            uri: http://posselect-ui-service.default.svc.cluster.local:80
         -  id: posselect-shell
            predicates:
            - Host=shell.posselect.com
            uri: http://posselect-shell-service.default.svc.cluster.local:80
         -  id: router-admin
            predicates:
            - Host=router.leedohyun.com
            uri: https://leedohyun.asuscomm.com:8443
            filters:
            - SetRequestHeader=Host, leedohyun.asuscomm.com
            - SetRequestHeader=Origin, https://leedohyun.asuscomm.com:8443
            - SetRequestHeader=Referer, https://leedohyun.asuscomm.com:8443/Main_Login.asp
         httpclient:
            ssl:
               trustedX509Certificates:
               - classpath:router-admin-ca.pem
logging:
   level:
      root: INFO
      '[com.dh.gateway]': DEBUG
   pattern:
      console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
   charset:
      console: UTF-8
